name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate deployment scripts
        run: bash -n deploy/*.sh

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag tubeyou:ci .

      - name: Lint PHP
        run: >-
          docker run --rm tubeyou:ci sh -lc
          "find /var/www/html -path /var/www/html/vendor -prune -o
          -name '*.php' -print0 | xargs -0 -n1 php -l"

      - name: Validate Composer metadata
        run: docker run --rm tubeyou:ci composer validate --no-check-publish --no-interaction

      - name: Verify runtime dependencies
        run: |
          docker run --rm tubeyou:ci ffmpeg -version
          docker run --rm tubeyou:ci php -r "exit(extension_loaded('pdo_mysql') && extension_loaded('redis') ? 0 : 1);"
