apiVersion: v1
kind: Namespace
metadata:
  name: tubeyou
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: tubeyou
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: tubeyou
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: tubeyou
spec:
  selector:
    app: tubeyou-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: tubeyou
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: tubeyou-mysql
  template:
    metadata:
      labels:
        app: tubeyou-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              value: tubeyou
            - name: MYSQL_USER
              value: tubeyou
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tubeyou-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tubeyou-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: db-init
          configMap:
            name: tubeyou-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tubeyou
spec:
  selector:
    app: tubeyou-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tubeyou
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tubeyou-redis
  template:
    metadata:
      labels:
        app: tubeyou-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 300Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: tubeyou
spec:
  type: NodePort
  selector:
    app: tubeyou
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: tubeyou
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tubeyou
  template:
    metadata:
      labels:
        app: tubeyou
    spec:
      initContainers:
        - name: seed-uploads
          image: tubeyou:local
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - cp -an /var/www/html/public/uploads/. /data/ && chown -R 33:33 /data
          volumeMounts:
            - name: uploads
              mountPath: /data
      containers:
        - name: app
          image: tubeyou:local
          imagePullPolicy: Never
          env:
            - name: APP_ENV
              value: production
            - name: APP_URL
              value: https://tubeyou.panto-dev.com
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: tubeyou
            - name: DB_USER
              value: tubeyou
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tubeyou-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: FFMPEG_PATH
              value: /usr/bin/ffmpeg
            - name: FFPROBE_PATH
              value: /usr/bin/ffprobe
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tubeyou-mail
                  key: RESEND_API_KEY
            - name: MAIL_USERNAME
              value: no-reply@mail.panto-dev.com
            - name: MAIL_FROM_NAME
              value: TubeYou
            - name: MAIL_REPLY_TO
              value: panto@panto-dev.com
          ports:
            - containerPort: 80
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/public/uploads
          livenessProbe:
            httpGet:
              path: /health.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready.php
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "3"
              memory: 2Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
