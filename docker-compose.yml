services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: tubeyou
      DB_USER: tubeyou
      DB_PASSWORD: secret
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: http://localhost:8080
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-no-reply@mail.panto-dev.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TubeYou}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-panto@panto-dev.com}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tubeyou
      MYSQL_USER: tubeyou
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tubeyou", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db_data:
